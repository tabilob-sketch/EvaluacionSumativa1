<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}EcoEnergy{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <!-- barra de navegación -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="{% url 'dashboard' %}">EcoEnergy</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
              aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <!-- Links principales -->
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'device_list' %}">Dispositivos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'measurement_list' %}">Mediciones</a>
          </li>
        </ul>

        <!-- Zona derecha -->
        <div class="d-flex align-items-center">
          {% if user.is_authenticated %}
            <span class="text-light me-3 small">
              Hola, <strong>{{ user.username }}</strong>
            </span>

            {% if user.is_staff %}
              <a href="/admin/" class="btn btn-warning btn-sm me-2">Panel Admin</a>
            {% endif %}

            <!-- Botón de perfil bien visible -->
            <a href="{% url 'profile' %}" class="btn btn-outline-light btn-sm me-2">
              Mi perfil
            </a>

            <a href="{% url 'logout' %}" class="btn btn-light btn-sm">
              Salir
            </a>
          {% else %}
            <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm me-2">Iniciar sesión</a>
            <a href="{% url 'register' %}" class="btn btn-light btn-sm">Registrarse</a>
          {% endif %}
        </div>
      </div>
    </div>
  </nav>

  <!-- Contenido -->
  <main class="container mb-5">
    {% block content %}{% endblock %}
  </main>

  <!-- librería JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
