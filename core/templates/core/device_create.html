{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Crear dispositivo</h2>

    <p class="text-muted">
        Completa los datos del dispositivo. Todos los campos son obligatorios.
    </p>

    <form method="post" class="mt-3">
        {% csrf_token %}

        <div class="mb-3">
            <label for="id_name" class="form-label">Nombre del dispositivo</label>
            <input
                type="text"
                name="name"
                id="id_name"
                class="form-control"
                required
                value="{{ request.POST.name|default:'' }}"
            >
        </div>

        <div class="mb-3">
            <label for="id_category" class="form-label">Categoría</label>
            <select name="category" id="id_category" class="form-select" required>
                <option value="">-- Selecciona una categoría --</option>
                {% for c in categories %}
                    <option value="{{ c.id }}"
                        {% if request.POST.category|default:'' == c.id|stringformat:"s" %}selected{% endif %}>
                        {{ c.name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label for="id_zone" class="form-label">Zona</label>
            <select name="zone" id="id_zone" class="form-select" required>
                <option value="">-- Selecciona una zona --</option>
                {% for z in zones %}
                    <option value="{{ z.id }}"
                        {% if request.POST.zone|default:'' == z.id|stringformat:"s" %}selected{% endif %}>
                        {{ z.name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="d-flex justify-content-between">
            <a href="{% url 'device_list' %}" class="btn btn-outline-secondary">
                Volver al listado
            </a>
            <button type="submit" class="btn btn-dark">
                Guardar dispositivo
            </button>
        </div>
    </form>
</div>
{% endblock %}
