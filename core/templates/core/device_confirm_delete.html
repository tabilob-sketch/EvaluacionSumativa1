{% extends "base.html" %}

{% block title %}Eliminar dispositivo{% endblock %}

{% block content %}
<h2>Eliminar dispositivo</h2>

<p>¿Estás seguro que quieres eliminar el dispositivo <strong>{{ device.name }}</strong>?</p>

<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Sí, eliminar</button>
  <a href="{% url 'device_detail' device.id %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
